name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build exe and installer
        shell: cmd
        run: build.cmd

      - name: SHA256 sums
        shell: pwsh
        run: |
          Get-FileHash build\Stripewake.exe, build\Stripewake-*-setup.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content build\SHA256SUMS.txt
          Get-Content build\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: stripewake
          path: |
            build/Stripewake.exe
            build/Stripewake-*-setup.exe
            build/SHA256SUMS.txt

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME build/Stripewake.exe (Get-Item build/Stripewake-*-setup.exe).FullName build/SHA256SUMS.txt --title "Stripewake $env:GITHUB_REF_NAME" --generate-notes
