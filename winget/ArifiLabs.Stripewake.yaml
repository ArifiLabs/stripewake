ShortDescription: Keep your PC awake from the tray. A 499 KB native app; a lightweight alternative to PowerToys Awake.
Description: |-
  Stripewake keeps Windows and the display awake from a tray icon. It is plain C with no runtime,
  uses about 2 MB of private memory and no CPU while idle. Timers (30 min to 8 h, or until a time),
  a live countdown on hover, dim when away, and a status check for lock and blank-screen risks.
